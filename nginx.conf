server {
    listen 80;
    server_name wiki.extremecraft.fun _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name wiki.extremecraft.fun _;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/wiki.extremecraft.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wiki.extremecraft.fun/privkey.pem;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
